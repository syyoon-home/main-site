<body>

<div class="dust" id="dust"></div>

<div class="stage">
  <div class="slip">
    <div class="eyebrow">Petal Divination</div>
    <h1>꽃잎 점</h1>
    <div class="sub">궁금한 것을 물으면, 꽃잎이 하나씩 떨어지며<br>그렇다 혹은 아니다로 답합니다.</div>

    <!-- 질문 입력 화면 -->
    <div id="screen-ask">
      <div class="field">
        <label for="q">묻고 싶은 것</label>
        <textarea id="q" placeholder="예: 오늘 그 사람에게 연락이 올까?" maxlength="80"></textarea>
      </div>
      <button class="btn" id="startBtn">꽃잎 뽑기</button>
    </div>

    <!-- 점치는 화면 -->
    <div id="screen-read">
      <div class="question-tag">Q.</div>
      <div class="question-text" id="qDisplay"></div>

      <div class="count-row">
        <span class="count-num" id="remainNum">0</span>
        <span class="count-label">남은 꽃잎</span>
      </div>

      <div class="flower-wrap">
        <svg id="flowerSvg" viewBox="0 0 400 500"></svg>
        <div class="word-pop" id="wordPop"></div>
      </div>
      <div class="hint" id="hint">꽃잎을 하나씩 눌러 떼어보세요</div>
      <button class="btn ghost auto-btn" id="autoBtn">자동으로 떨구기</button>
      <div class="ground" id="ground"></div>

      <!-- 결과 -->
      <div id="result">
        <div class="result-label">The Answer Is</div>
        <div class="result-word" id="resultWord">그렇다</div>
        <div class="result-line" id="resultLine"></div>
        <div class="result-btns">
          <button class="btn ghost" id="retryBtn">같은 질문으로 다시</button>
          <button class="btn" id="newBtn">새 질문하기</button>
        </div>
      </div>
    </div>
