<body>
<div class="page">

  <h1>이름 획수 궁합</h1>
  <div class="sub">두 사람의 이름을 초성·중성·종성 획수로 쪼갠 뒤, 옛날 방식 그대로 숫자를 한 줄씩 줄여가며 궁합을 계산해요. (재미로만 봐주세요 🙂)</div>
  <div class="privacy-note">🔒 입력한 이름은 서버로 전송되거나 저장되지 않아요. 모든 계산은 이 화면 안에서만 이뤄집니다.</div>

  <div class="row">
    <div class="field">
      <label>이름 1 (본명·태명·닉네임 모두 가능)</label>
      <input id="name1" type="text" maxlength="12" placeholder="예: 김민수, 콩콩이, 라떼">
    </div>
    <div class="field">
      <label>이름 2</label>
      <input id="name2" type="text" maxlength="12" placeholder="예: 박지우, 초코, 냥냥이">
    </div>
  </div>
  <div class="actions">
    <button class="primary" id="calcBtn">궁합 계산하기</button>
    <button class="ghost" id="resetBtn">초기화</button>
  </div>
  <div class="error" id="errorMsg"></div>
  <div class="info-note" id="infoNote"></div>

  <div id="stage2">
    <div class="section-title">① 글자 획수 세기</div>
    <div id="decomp"></div>
  </div>

  <div id="stage3">
    <div class="section-title">② 숫자 줄여가기</div>
    <div id="pyramid"></div>
  </div>

  <div id="result">
    <div class="percent" id="percentNum">--<span>%</span></div>
    <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
    <div class="message" id="message"></div>
    <div class="share-row">
      <button class="share" id="shareBtn">📸 이미지로 저장/공유</button>
    </div>
    <div class="share-hint" id="shareHint">저장한 이미지를 카카오톡 등에 첨부해서 보내보세요</div>
  </div>

  <canvas id="cardCanvas" width="900" height="900" style="display:none;"></canvas>

  <div class="footnote">한글 자모 획수를 기준으로 한 전통적인 놀이 방식의 궁합 계산기이며, 과학적 근거가 있는 진단은 아니에요.</div>
