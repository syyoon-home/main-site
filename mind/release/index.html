<body>
<div class="scene">
  <header>
    <h1>털어버리기</h1>
    <p class="sub">마음에 담아둔 말을 적고, 찢거나 태우거나 구겨서 놓아보세요.</p>

  <div class="paper-wrap" id="paperWrap">
    <div class="burn-glow" id="burnGlow"></div>
    <div class="paper" id="paper">
      <button class="clear-btn" id="clearBtn" type="button" aria-label="지우기">&#10005;</button>
      <textarea id="textInput" placeholder="여기에 적어보세요..." maxlength="600"></textarea>
    </div>
    <canvas class="burn-canvas" id="burnCanvas"></canvas>
    <canvas class="burn-canvas" id="flameCanvas"></canvas>
  </div>

  <div class="aftermath" id="aftermath">
    <p class="msg" id="aftermathMsg">이제 그 마음은 여기 없어요.</p>
    <p class="sub2">필요할 때 언제든 다시 써보세요.</p>
    <button class="reset-btn" id="resetBtn">다시 쓰기</button>
  </div>

  <div class="actions" id="actions">
    <button class="act" data-action="tear">찢기</button>
    <button class="act" data-action="burn">태우기</button>
    <button class="act" data-action="crumple">구겨서 버리기</button>
  </div>
  <div class="hint" id="hint">먼저 마음속 이야기를 적어보세요</div>
