<body>
<div class="page">

  <header>
    <div>
      <p class="brand-eyebrow">정적 페이지 · 서버 전송 없음 · 브라우저 내에서 변환</p>
      <h1><span class="json-hl">JSON</span><span class="sep">⇄</span><span class="csv-hl">CSV</span><span class="sep">⇄</span><span class="yaml-hl">YAML</span></h1>
    </div>
  </header>

  <div class="switchyard">
    <div class="format-group" id="sourceGroup">
      <span class="glabel">원본</span>
      <button class="pill active" data-fmt="json">JSON</button>
      <button class="pill" data-fmt="yaml">YAML</button>
      <button class="pill" data-fmt="csv">CSV</button>
    </div>

    <div class="track">
      <svg viewBox="0 0 46 14"><line x1="0" y1="7" x2="46" y2="7" stroke="#B9C4B4" stroke-width="2" stroke-dasharray="4 4"/></svg>
      <button class="swap-btn" id="swapBtn" title="원본/대상 형식 바꾸기">⇄</button>
      <svg viewBox="0 0 46 14"><line x1="0" y1="7" x2="46" y2="7" stroke="#B9C4B4" stroke-width="2" stroke-dasharray="4 4"/></svg>
    </div>

    <div class="format-group" id="targetGroup">
      <span class="glabel">대상</span>
      <button class="pill" data-fmt="json">JSON</button>
      <button class="pill" data-fmt="yaml">YAML</button>
      <button class="pill active" data-fmt="csv">CSV</button>
    </div>
  </div>

  <main class="editors">
    <section class="panel source" data-fmt="json">
      <div class="panel-head">
        <span class="tag" id="sourceTag">JSON</span>
        <div class="panel-actions">
          <button class="mini-btn" id="sampleBtn">샘플</button>
          <button class="mini-btn" id="clearBtn">지우기</button>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="gutter" id="gutterIn"></div>
        <textarea id="input" spellcheck="false" placeholder="여기에 JSON, CSV 또는 YAML을 붙여넣으세요…"></textarea>
      </div>
      <div class="status" id="statusIn">0줄</div>
    </section>

    <div class="connector">
      <button id="convertBtn">변환 →</button>
    </div>

    <section class="panel output" data-fmt="csv">
      <div class="panel-head">
        <span class="tag" id="targetTag">CSV</span>
        <div class="panel-actions">
          <button class="mini-btn" id="copyBtn">복사</button>
          <button class="mini-btn" id="downloadBtn">다운로드</button>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="gutter" id="gutterOut"></div>
        <textarea id="output" spellcheck="false" readonly placeholder="변환 결과가 여기에 표시됩니다"></textarea>
      </div>
      <div class="status" id="statusOut">대기 중</div>
    </section>
  </main>

  <footer>
    변환 · 압축 해제 모두 브라우저 안에서만 실행되며 데이터는 어디로도 전송되지 않습니다.
    <div class="legend">
      <span><span class="dot json"></span>JSON — 중첩 깊이</span>
      <span><span class="dot yaml"></span>YAML — 들여쓰기 깊이</span>
      <span><span class="dot csv"></span>CSV — 헤더 / 행</span>
    </div>

    </div>
  </footer>
