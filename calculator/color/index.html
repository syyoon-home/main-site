<body>
<div class="page">

  <header class="masthead">
    <span class="eyebrow">CLR · LAB</span>
    <h1>컬러 코드 변환기</h1>
    <p class="tagline">HEX, RGB, HSL 값을 실시간으로 서로 변환하고, 색상 하나 또는 이미지 한 장에서 팔레트를 뽑아보세요.</p>
  </header>

  <section class="chip-card" aria-label="색상 변환 카드">
    <div class="chip-top">
      <span class="chip-fg-note" id="fgNote" style="color:var(--muted); opacity:1;">
        <span class="chip-fg-dot" id="fgDot" style="background:var(--muted);"></span>
        <span id="fgText">텍스트는 밝은색 권장</span>
      </span>
      <div class="chip-actions">
        <button class="ghost-btn" id="randomBtn" type="button">랜덤 색상</button>
      </div>
    </div>

    <div class="chip-swatch" id="swatch"></div>
    <div class="chip-perf" aria-hidden="true"></div>

    <div class="chip-label">
      <div class="field">
        <div class="field-head">
          <label for="hexInput">HEX</label>
          <button class="copy-btn" data-copy-input="hexInput" type="button">복사</button>
        </div>
        <input id="hexInput" class="hex-input" type="text" maxlength="7" spellcheck="false" autocomplete="off" value="#2E9E8E">
      </div>

      <div class="field">
        <div class="field-head">
          <label>RGB</label>
          <button class="copy-btn" id="copyRgb" type="button">복사</button>
        </div>
        <div class="slider-row">
          <span class="slider-tag">R</span>
          <input type="range" id="rSlider" min="0" max="255" step="1" value="46">
          <span class="slider-val" id="rVal">46</span>
        </div>
        <div class="slider-row">
          <span class="slider-tag">G</span>
          <input type="range" id="gSlider" min="0" max="255" step="1" value="158">
          <span class="slider-val" id="gVal">158</span>
        </div>
        <div class="slider-row">
          <span class="slider-tag">B</span>
          <input type="range" id="bSlider" min="0" max="255" step="1" value="142">
          <span class="slider-val" id="bVal">142</span>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <label>HSL</label>
          <button class="copy-btn" id="copyHsl" type="button">복사</button>
        </div>
        <div class="slider-row">
          <span class="slider-tag">H</span>
          <input type="range" id="hSlider" min="0" max="360" step="1" value="169">
          <span class="slider-val" id="hVal">169°</span>
        </div>
        <div class="slider-row">
          <span class="slider-tag">S</span>
          <input type="range" id="sSlider" min="0" max="100" step="1" value="55">
          <span class="slider-val" id="sVal">55%</span>
        </div>
        <div class="slider-row">
          <span class="slider-tag">L</span>
          <input type="range" id="lSlider" min="0" max="100" step="1" value="40">
          <span class="slider-val" id="lVal">40%</span>
        </div>
      </div>
    </div>
  </section>

  <section class="palette-card" aria-label="팔레트 추출">
    <div class="palette-head">
      <h2>팔레트 추출</h2>
      <p class="palette-hint">스와치를 클릭하면 코드가 복사됩니다</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-mode="complementary" type="button">보색</button>
      <button class="tab-btn" data-mode="analogous" type="button">유사색</button>
      <button class="tab-btn" data-mode="triadic" type="button">삼색조</button>
      <button class="tab-btn" data-mode="shades" type="button">명도 단계</button>
      <button class="tab-btn" data-mode="image" type="button">이미지에서 추출</button>
    </div>

    <div id="imageTabPanel" style="display:none; margin-bottom:14px;">
      <label class="drop-zone" id="dropZone" for="imageInput">
        <strong>이미지를 드래그하거나 클릭</strong>해서 업로드하면<br>주요 색상 6개를 뽑아드려요.
        <input id="imageInput" type="file" accept="image/*">
      </label>
      <p style="font-size:11px; color:var(--muted); margin:8px 2px 0;">업로드한 이미지는 서버에 저장되지 않고, 브라우저 안에서만 분석 후 즉시 사라져요.</p>
    </div>

    <div class="swatch-grid" id="paletteGrid"></div>
  </section>

  <footer class="site-footer-note">
    모든 변환과 이미지 분석은 브라우저 안에서만 이루어지며, 어떤 데이터도 서버로 전송되지 않습니다.
    <div class="legal-links">
      <a href="/">홈</a> · <a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a>
    </div>
  </footer>

</div>
