    <span class="eyebrow">반려동물 나이 계산기</span>
    <h1>우리 아이는<br>사람 나이로 <span>몇 살</span>일까?</h1>
  </header>

  <main class="card">
    <div class="toggle">
      <button type="button" class="active" data-sp="dog" onclick="setSpecies('dog')">🐶 강아지</button>
      <button type="button" data-sp="cat" onclick="setSpecies('cat')">🐱 고양이</button>
    </div>

    <div class="field">
      <label for="years">우리 아이 나이</label>
      <div class="row">
        <div class="input-group">
          <input type="number" id="years" min="0" max="30" placeholder="0" inputmode="numeric">
          <span class="unit">년</span>
        </div>
        <div class="input-group">
          <input type="number" id="months" min="0" max="11" placeholder="0" inputmode="numeric">
          <span class="unit">개월</span>
        </div>
      </div>
    </div>

    <div class="field" id="sizeField">
      <label>몸무게 기준 크기 (강아지만 해당)</label>
      <div class="segmented">
        <button type="button" class="active" data-size="small" onclick="setSize('small')">소형견<br>~10kg</button>
        <button type="button" data-size="medium" onclick="setSize('medium')">중형견<br>10~25kg</button>
        <button type="button" data-size="large" onclick="setSize('large')">대형견<br>25kg~</button>
      </div>
    </div>

    <button class="calc-btn" onclick="calculate()">나이 계산하기</button>

    <div class="result-wrap" id="resultWrap">
      <div class="tag-ring"></div>
      <div class="tag">
        <span class="icon" id="resultIcon">🐶</span>
        <div class="big-number" id="resultNumber">0</div>
        <div class="unit">사람 나이로 환산</div>
        <div class="sub" id="resultSub">입력한 나이 기준</div>
      </div>
    </div>

    <div class="desc" id="resultDesc" style="display:none;"></div>
