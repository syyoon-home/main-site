<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mark">ID//</span>
      <h1>FORGE</h1>
    </div>
    <div class="stat-line">이번 세션 발행 수 &nbsp;<b id="totalCount">0</b></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-mode="uuid4">UUID v4</button>
    <button class="tab" data-mode="uuid7">UUID v7</button>
    <button class="tab" data-mode="random">랜덤 문자열</button>
    <button class="tab" data-mode="cryptokey">암호화 키 (HEX)</button>
  </div>

  <div class="panel">

    <!-- UUID options (shared look, v7 has same options as v4) -->
    <div id="uuidOptions">
      <div class="field-row">
        <div class="field">
          <label>표기 형식</label>
          <select id="uuidCase">
            <option value="lower">소문자 (기본)</option>
            <option value="upper">대문자</option>
          </select>
        </div>
        <div class="field">
          <label>하이픈</label>
          <select id="uuidHyphen">
            <option value="on">포함 (xxxx-xxxx-...)</option>
            <option value="off">제거</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Random string options -->
    <div id="randomOptions" style="display:none;">
      <div class="field-row">
        <div class="field" style="flex: 2;">
          <label>문자 구성</label>
          <div class="checks">
            <label class="chip on"><input type="checkbox" data-set="lower" checked> a-z</label>
            <label class="chip on"><input type="checkbox" data-set="upper" checked> A-Z</label>
            <label class="chip on"><input type="checkbox" data-set="digits" checked> 0-9</label>
            <label class="chip"><input type="checkbox" data-set="symbols"> !@#$%^&*</label>
            <label class="chip"><input type="checkbox" data-set="hexOnly"> HEX 전용 (0-9a-f)</label>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="field-row">
        <div class="field">
          <label>길이 — <span class="range-val" id="lenVal">16</span></label>
          <div class="range-row">
            <input type="range" id="lenRange" min="4" max="128" value="16">
          </div>
        </div>
      </div>
    </div>

    <!-- Crypto key (HEX) options -->
    <div id="cryptokeyOptions" style="display:none;">
      <div class="field-row">
        <div class="field">
          <label>키 길이</label>
          <select id="keyBits">
            <option value="128">128비트 (32자 HEX) — AES-128</option>
            <option value="256" selected>256비트 (64자 HEX) — AES-256 / JWT</option>
          </select>
        </div>
        <div class="field">
          <label>접두사</label>
          <select id="keyPrefix">
            <option value="none">없음</option>
            <option value="0x">0x 포함</option>
          </select>
        </div>
      </div>
      <div class="key-note">
        브라우저에서 <code>crypto.getRandomValues</code>로 생성되는 암호학적으로 안전한 값입니다. 다만 프로덕션 시크릿은 화면에 노출되지 않는 서버 환경에서 생성하는 것을 권장합니다.
      </div>
    </div>

    <div class="divider"></div>

    <div class="gen-row">
      <button class="btn-clear" id="clearBtn">기록 지우기</button>
      <div class="gen-group">
        <div class="count-field">
          <span>개수</span>
          <input type="number" id="genCount" value="1" min="1" max="100">
        </div>
        <button class="btn-stamp" id="genBtn">생성</button>
      </div>
    </div>

  </div>

  <div class="ledger-head">
    <h2>발행 기록</h2>
    <button class="copy-all" id="copyAllBtn">전체 복사</button>
  </div>

  <div class="ledger" id="ledger">
    <div class="empty-state" id="emptyState">생성 버튼을 누르면 여기에 결과가 쌓입니다</div>
  </div>

  <footer>
    모든 생성은 브라우저 내에서만 이루어지며, 어떤 값도 서버로 전송되지 않습니다.

      <a href="/">홈</a> · <a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a>
    </div>
  </footer>

</div>
